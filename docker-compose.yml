version: '3.8'

services:
  # 1. Relational Database: MySQL 8.0 (ACID Transactions & InnoDB Row Locking)
  mysql:
    image: mysql:8.0
    container_name: vehicle_rental_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vehicle_rental_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - vehicle_rental_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. NoSQL Database: MongoDB (Flexible Specs, Logs & Documents)
  mongodb:
    image: mongo:7.0
    container_name: vehicle_rental_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - vehicle_rental_net

  # 3. In-Memory Cache: Redis 7 (Cache-Aside Pattern & Latency Reduction)
  redis:
    image: redis:7-alpine
    container_name: vehicle_rental_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vehicle_rental_net

  # 4. Graph Database: Neo4j (Recommendation Engine & Cypher Queries)
  neo4j:
    image: neo4j:5.15-community
    container_name: vehicle_rental_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
    networks:
      - vehicle_rental_net

  # 5. Backend API Service: Node.js Express
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: vehicle_rental_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started
    environment:
      PORT: 5000
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: vehicle_rental_db
      MONGODB_URI: mongodb://mongodb:27017/vehicle_rental_nosql
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: neo4j_password
      JWT_SECRET: drive_elite_jwt_secure_key_2026_xyz987
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"
    networks:
      - vehicle_rental_net

  # 6. Frontend Web Portal: React + Vite + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: vehicle_rental_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - vehicle_rental_net

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  neo4j_data:

networks:
  vehicle_rental_net:
    driver: bridge
